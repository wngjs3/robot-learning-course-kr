<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>강의 보기 — Robot Learning</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="assets/css/style.css?v=6" />
</head>
<body class="lecture-page">

<div class="container">
  <header class="lec-header">
    <div class="lec-crumb"><a href="index.html">홈</a> / <span id="crumb-here">강의</span></div>
    <div class="lec-title-row">
      <h1 class="lec-title" id="lec-title">불러오는 중…<span class="en" id="lec-title-en"></span></h1>
      <div class="lec-nav-btns">
        <a class="chip" id="prev-btn" style="display:none;">← 이전 강의</a>
        <a class="chip" id="next-btn" style="display:none;">다음 강의 →</a>
      </div>
    </div>
  </header>

  <!-- 메인 무대: 영상 ↔ 드래그 분할선 ↔ 현재 슬라이드 -->
  <div class="stage no-slide" id="stage">
    <div class="stage-video" id="stage-video">
      <div class="video-shell">
        <div id="yt-player"></div>
      </div>
    </div>
    <div class="stage-divider" id="stage-divider" title="드래그해서 크기 조절"><span></span></div>
    <div class="stage-slide" id="stage-pane" style="display:none;">
      <div class="slide-shell">
        <img id="stage-slide-img" alt="현재 슬라이드 (한국어 번역)" title="클릭하면 이 슬라이드 구간으로 이동" />
        <div class="slide-tools">
          <button id="slide-prev" title="이전 슬라이드">‹</button>
          <span id="slide-pos">-</span>
          <button id="slide-next" title="다음 슬라이드">›</button>
          <button id="slide-follow" class="follow on" title="영상 따라 자동 전환">따라가기 ON</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 전용 자막 줄: 영상/슬라이드를 가리지 않음 -->
  <div class="cc-strip" id="cc-strip"><span id="cc-text"></span></div>

  <div class="cc-bar">
    <label class="toggle"><input type="checkbox" id="cc-toggle" checked /> 한국어 자막</label>
    <span class="cc-hint">분할선을 드래그하면 영상/슬라이드 크기를 조절할 수 있어요</span>
  </div>

  <div class="lec-layout">
    <div class="lec-left">
      <div class="now-chapter" id="now-chapter" style="display:none;">
        <span class="label">지금 보고 있는 구간</span>
        <h3 id="now-title"></h3>
        <p id="now-explain"></p>
      </div>

      <div class="lec-meta-row" id="lec-meta-row"></div>
    </div>

    <aside class="lec-right">
      <div class="tabs">
        <button class="tab-btn active" data-tab="chapters">해설</button>
        <button class="tab-btn" data-tab="subs">자막</button>
        <button class="tab-btn" data-tab="slides" id="slides-tab" style="display:none;">슬라이드</button>
        <button class="tab-btn" data-tab="summary">요약</button>
      </div>
      <div class="tab-tools">
        <label class="toggle"><input type="checkbox" id="autoscroll" checked /> 영상 따라 자동 스크롤</label>
        <label class="toggle" id="en-toggle-wrap" style="display:none;"><input type="checkbox" id="show-en" /> 영어 원문</label>
      </div>
      <div class="panel" id="panel-chapters">
        <div class="loading-box"><div class="spinner"></div>한국어 해설을 불러오는 중…</div>
      </div>
      <div class="panel" id="panel-subs" style="display:none;"></div>
      <div class="panel" id="panel-slides" style="display:none;"></div>
      <div class="panel" id="panel-summary" style="display:none;"></div>
    </aside>
  </div>
</div>

<script src="assets/js/course-data.js"></script>
<script src="assets/js/lecture.js?v=2"></script>
</body>
</html>
